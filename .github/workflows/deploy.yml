name: Desplegar a GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion-motiv-front
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar producción
        run: npm run build:prod

      - name: Publicar www/ por FTP
        uses: nick-fields/retry@v4
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 45
          command: |
            if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
              echo "Falta FTP_SERVER, FTP_USERNAME o FTP_PASSWORD"
              exit 1
            fi
            npx --yes @samkirkland/ftp-deploy \
              --server "$FTP_SERVER" \
              --username "$FTP_USERNAME" \
              --password "$FTP_PASSWORD" \
              --local-dir "./www/" \
              --server-dir "/" \
              --protocol ftp \
              --port 21 \
              --timeout 60000 \
              --dangerous-clean-slate true
